name: Iot Sensor Platform CI
on:
  push:
    branches: [ "main" ]
    # 서버 코드와 로컬 simulator를 검증한다. 서버 배포 관련 변경만 이미지를 발행한다.
    paths:
      - "services/backend/**"
      - "services/explain/**"
      - "services/simulator/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/publish-images.yml"
      - ".github/scripts/propose-bugi-server-infra-release.sh"

# main push가 연달아 오면 최신 commit이 앞선 commit을 모두 포함하므로 오래된 run은 취소한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
    outputs:
      server_release: ${{ steps.server-release.outputs.changed }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect server release changes
        id: server-release
        shell: bash
        run: |
          if git diff --quiet "${{ github.event.before }}" "${{ github.sha }}" -- \
            services/backend \
            services/explain \
            .github/workflows/ci.yml \
            .github/workflows/publish-images.yml \
            .github/scripts/propose-bugi-server-infra-release.sh; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: services/backend
      - name: Build with Gradle
        run: ./gradlew build
        working-directory: services/backend
      - name: Prepare tested backend artifact
        if: steps.server-release.outputs.changed == 'true'
        run: |
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' -print)
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected exactly one executable backend jar, found ${#jars[@]}" >&2
            exit 1
          fi
          mkdir -p build/ci-image
          cp "${jars[0]}" build/ci-image/app.jar
        working-directory: services/backend
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install explain dependencies
        run: |
          python -m pip install uv
          uv sync --frozen
        working-directory: services/explain
      - name: Test explain
        run: uv run pytest
        working-directory: services/explain
      - name: Install simulator dependencies
        run: pip install -r requirements.txt
        working-directory: services/simulator
      - name: Test simulator
        run: python -m unittest -v test_simulator.py
        working-directory: services/simulator
      - name: Upload tested backend artifact
        if: steps.server-release.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: backend-boot-jar
          path: services/backend/build/ci-image/app.jar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish-images:
    name: Publish immutable images
    needs: build
    if: needs.build.outputs.server_release == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-images.yml
    with:
      services: all
      use_backend_artifact: true

  propose-bugi-server-infra-release:
    name: Propose bugi-server-infra release
    needs: publish-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Sensor Monitor automation
        uses: actions/checkout@v4

      - name: Checkout bugi-server-infra
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/bugi-server-infra
          ref: main
          path: bugi-server-infra
          token: ${{ secrets.BUGI_SERVER_INFRA_PR_TOKEN }}

      - name: Update Sensor pin and open PR
        env:
          GH_TOKEN: ${{ secrets.BUGI_SERVER_INFRA_PR_TOKEN }}
          INFRA_REPOSITORY: ${{ github.repository_owner }}/bugi-server-infra
          SOURCE_SHA: ${{ github.sha }}
        run: bash .github/scripts/propose-bugi-server-infra-release.sh bugi-server-infra
